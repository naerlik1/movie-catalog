name: movie-catalog

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-movies}
      POSTGRES_USER: ${DB_USER:-movies}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  app:
    image: ${BACKEND_IMAGE:-movie-catalog-backend:local}
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    image: ${FRONTEND_IMAGE:-movie-catalog-frontend:local}
    build: ./frontend
    ports:
      - '${APP_PORT:-8084}:80'
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1/health']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
