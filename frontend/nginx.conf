server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;

    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"errors":{"file":"Размер запроса превышает 16 МБ. Постер должен быть до 5 МБ."}}';
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезаписываем переданный клиентом заголовок для корректного лимита входа по IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }
    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }
    location /media/ {
        alias /app/uploads/public/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
